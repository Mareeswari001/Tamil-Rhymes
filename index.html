<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>குட்டி பாடல்கள்</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:'Baloo Thambi 2',sans-serif;}
body{
  background:linear-gradient(160deg,#FF9A9E,#FAD0C4);
  transition:background 1.4s ease;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100%;
}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
#confettiLayer{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden;}
.confetti-piece{position:absolute;font-size:26px;animation:confettiFall linear forwards;}
@keyframes confettiFall{0%{transform:translateY(-40px) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}

/* CARD */
#card{
  position:relative;z-index:10;
  width:min(98vw,800px);
  background:rgba(255,255,255,.22);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:2.5px solid rgba(255,255,255,.6);
  border-radius:40px;
  padding:24px 26px 20px;
  box-shadow:0 24px 64px rgba(0,0,0,.2);
  text-align:center;
}

/* TABS */
#tabs{display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;}
.tab{
  font-family:'Baloo Thambi 2',sans-serif;font-weight:700;
  font-size:clamp(13px,2.4vw,17px);
  padding:8px 16px;border-radius:999px;border:none;cursor:pointer;
  background:rgba(255,255,255,.3);color:#fff;
  border:2px solid rgba(255,255,255,.5);transition:.2s;
}
.tab.active{background:#fff;color:#D72B6E;box-shadow:0 4px 14px rgba(0,0,0,.12);}

/* PROGRESS */
#progressWrap{width:100%;height:10px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden;margin-bottom:14px;}
#progressBar{height:100%;width:0%;background:linear-gradient(90deg,#fff,#FFD23F);border-radius:99px;transition:width .5s ease;}

/* TITLE */
#rhymeTitle{
  font-size:clamp(32px,7vw,60px);font-weight:800;color:#fff;
  text-shadow:0 4px 0 rgba(0,0,0,.15),0 0 30px rgba(255,200,50,.7);
  margin-bottom:12px;letter-spacing:2px;
}

/* MASCOTS */
#mascotRow{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin-bottom:12px;min-height:90px;}
.moji{
  font-size:clamp(38px,8vw,70px);
  display:inline-block;
  transition:transform .3s;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.15));
}
.moji.bounce{animation:mojiDance .65s ease-in-out infinite alternate;}
@keyframes mojiDance{
  from{transform:translateY(0) rotate(-5deg) scale(1);}
  to{transform:translateY(-18px) rotate(5deg) scale(1.1);}
}

/* LYRIC BOX */
#lyricBox{
  background:rgba(255,255,255,.93);
  border-radius:26px;
  padding:18px 22px 20px;
  min-height:130px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 8px 28px rgba(0,0,0,.1);
  margin-bottom:16px;
  gap:10px;
  position:relative;overflow:hidden;
}
/* shine sweep on line change */
#lyricBox::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);
  transform:translateX(-100%);
  transition:none;
}
#lyricBox.flash::after{
  animation:shineSweep .5s ease forwards;
}
@keyframes shineSweep{from{transform:translateX(-100%);}to{transform:translateX(200%);}}

.lyric-prev{
  font-size:clamp(14px,3vw,24px);
  font-weight:600;
  color:#bbb;
  transition:all .4s;
  line-height:1.3;
}
.lyric-current{
  font-size:clamp(20px,4.8vw,40px);
  font-weight:800;
  color:#D72B6E;
  line-height:1.35;
  animation:lineIn .4s cubic-bezier(.34,1.56,.64,1);
  text-shadow:0 2px 12px rgba(215,43,110,.25);
}
.lyric-next{
  font-size:clamp(14px,3vw,24px);
  font-weight:600;
  color:#999;
  transition:all .4s;
  line-height:1.3;
}
@keyframes lineIn{0%{transform:scale(.8) translateY(8px);opacity:0;}100%{transform:scale(1) translateY(0);opacity:1;}}

/* CONTROLS */
#controls{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;}
.btn{
  font-family:'Baloo Thambi 2',sans-serif;font-weight:800;
  font-size:clamp(13px,2.4vw,18px);
  padding:11px 24px;border:none;border-radius:999px;
  cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px;
}
.btn:active{transform:scale(.93);}
#playBtn{
  background:linear-gradient(135deg,#FF5F6D,#FFC371);color:#fff;
  box-shadow:0 6px 20px rgba(255,95,109,.5);
  font-size:clamp(15px,2.8vw,20px);padding:13px 30px;
}
#loopBtn{background:rgba(255,255,255,.32);color:#fff;border:2px solid rgba(255,255,255,.55);}
#loopBtn.on{background:#fff;color:#D72B6E;}
.sbtn{background:rgba(255,255,255,.22);color:#fff;border:2px solid rgba(255,255,255,.45);padding:10px 14px;}

/* NOTE PARTICLES */
.note{
  position:fixed;pointer-events:none;
  font-size:22px;z-index:80;
  animation:floatNote 2s ease-out forwards;
}
@keyframes floatNote{
  0%{opacity:1;transform:translateY(0) rotate(0deg) scale(1);}
  100%{opacity:0;transform:translateY(-130px) rotate(25deg) scale(1.3);}
}

/* INTRO SCREEN */
#intro{
  position:fixed;inset:0;z-index:200;
  background:linear-gradient(135deg,#FFB347 0%,#FF6F91 50%,#B24592 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:30px;
  transition:opacity .7s ease;
}
#intro h1{font-size:clamp(38px,9vw,72px);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.15);margin-bottom:6px;}
#intro p{font-size:clamp(14px,2.5vw,20px);color:rgba(255,255,255,.92);margin-bottom:28px;max-width:460px;line-height:1.5;}
#startBtn{
  font-family:'Baloo Thambi 2',sans-serif;font-weight:800;
  font-size:clamp(18px,3.5vw,28px);padding:18px 50px;
  border:none;border-radius:999px;color:#D72B6E;background:#fff;
  cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.2);
  animation:pulseBig 1.6s ease-in-out infinite;
}
@keyframes pulseBig{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}
#startBtn:active{transform:scale(.95);}

/* intro mascot row */
.intro-emoji{font-size:clamp(40px,10vw,72px);animation:introFloat 2s ease-in-out infinite alternate;}
.intro-emoji:nth-child(2){animation-delay:.3s;}
.intro-emoji:nth-child(3){animation-delay:.6s;}
.intro-emoji:nth-child(4){animation-delay:.9s;}
@keyframes introFloat{from{transform:translateY(0) rotate(-5deg);}to{transform:translateY(-14px) rotate(5deg);}}

@media(max-width:480px){
  #card{padding:16px 12px 14px;}
  .btn{padding:9px 14px;}
  #playBtn{padding:11px 22px;}
}

/* ============================================================
   CANVAS BACKGROUND — floating emoji particles
   ============================================================ */
const canvas = document.getElementById('bgCanvas');
const ctx2d = canvas.getContext('2d');
let W=0,H=0;
const particles=[];
const P_CHARS = ['🌟','⭐','✨','🎵','🎶','🌸','💫','🌺','🎈'];

function resizeCanvas(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function makeParticle(init){
  return {
    x: Math.random()*W,
    y: init ? Math.random()*H : H+40,
    size: 14+Math.random()*18,
    vx: (Math.random()-.5)*.5,
    vy: -(0.35+Math.random()*.7),
    alpha: 0.1+Math.random()*.22,
    char: P_CHARS[Math.floor(Math.random()*P_CHARS.length)]
  };
}
for(let i=0;i<30;i++) particles.push(makeParticle(true));

function animateCanvas(){
  ctx2d.clearRect(0,0,W,H);
  particles.forEach((p,i)=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.y < -50){ particles[i]=makeParticle(false); return; }
    ctx2d.save();
    ctx2d.globalAlpha=p.alpha;
    ctx2d.font=`${p.size}px serif`;
    ctx2d.fillText(p.char,p.x,p.y);
    ctx2d.restore();
  });
  requestAnimationFrame(animateCanvas);
}
animateCanvas();

/* ============================================================
   WEB AUDIO ENGINE
   ============================================================ */
let audioCtx=null, masterGain=null;

function ensureAudio(){
  if(audioCtx && audioCtx.state!=='closed') return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.55;
  masterGain.connect(audioCtx.destination);
}

function playTone(freq, start, dur, type='triangle', vol=0.4){
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g   = audioCtx.createGain();
  osc.connect(g); g.connect(masterGain);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.linearRampToValueAtTime(vol, start+0.04);
  g.gain.exponentialRampToValueAtTime(0.0001, start+dur*0.88);
  osc.start(start);
  osc.stop(start+dur+0.01);
}

function playNoiseHit(start, dur, vol=0.18){
  if(!audioCtx) return;
  const buf = audioCtx.createBuffer(1, Math.ceil(audioCtx.sampleRate*dur), audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
  const src = audioCtx.createBufferSource();
  const g   = audioCtx.createGain();
  src.buffer=buf; src.connect(g); g.connect(masterGain);
  g.gain.setValueAtTime(vol, start);
  g.gain.exponentialRampToValueAtTime(0.0001, start+dur);
  src.start(start); src.stop(start+dur+0.01);
}

function scheduleSong(melody, bpm, startAt){
  ensureAudio();
  const beat = 60/bpm;
  const totalBeats = melody.reduce((s,[,b])=>s+b, 0);

  /* ── Drums ── */
  for(let b=0; b<totalBeats; b++){
    const t = startAt + b*beat;
    if(b%4===0){            // KICK
      playTone(150, t, 0.14, 'sine', 0.7);
      const o2=audioCtx.createOscillator(), g2=audioCtx.createGain();
      o2.connect(g2); g2.connect(masterGain);
      o2.frequency.setValueAtTime(150,t); o2.frequency.exponentialRampToValueAtTime(40,t+0.12);
      g2.gain.setValueAtTime(.65,t); g2.gain.exponentialRampToValueAtTime(.0001,t+.18);
      o2.start(t); o2.stop(t+.19);
    }
    if(b%4===2) playNoiseHit(t+.002, 0.1, 0.28); // SNARE
    if(b%2===1) playNoiseHit(t+.001, 0.025, 0.12); // hi-hat
  }

  /* ── Bass (root, half-speed) ── */
  const bassRoots=[261,294,330,349,392];
  let bassT=startAt, bassStep=0;
  melody.forEach(([freq, beats])=>{
    const root = bassRoots[bassStep % bassRoots.length];
    playTone(root*0.5, bassT, beats*beat*0.9, 'sine', 0.22);
    bassT += beats*beat;
    if(beats>=2) bassStep++;
  });

  /* ── Melody ── */
  let t=startAt;
  melody.forEach(([freq,beats])=>{
    const dur = beats*beat;
    playTone(freq, t, dur*0.88, 'triangle', 0.42);
    playTone(freq*1.259, t, dur*0.88, 'triangle', 0.1); // major third harmony
    t += dur;
  });

  /* ── Sparkle arpeggio (high octave, sparse) ── */
  t=startAt;
  melody.forEach(([freq,beats],i)=>{
    const dur=beats*beat;
    if(i%6===0) playTone(freq*2, t+dur*0.5, dur*0.3, 'sine', 0.08);
    t+=dur;
  });

  return startAt + totalBeats*beat;
}

/* Intro jingle */
function playJingle(cb){
  ensureAudio();
  const now=audioCtx.currentTime+0.05;
  const beat=60/200;
  const notes=[[523,1],[659,1],[784,1],[1047,1],[1175,2]];
  let t=now;
  notes.forEach(([f,b])=>{
    playTone(f, t, b*beat*0.85, 'triangle', 0.5);
    playTone(f*1.5, t, b*beat*0.6, 'sine', 0.18);
    t+=b*beat;
  });
  setTimeout(cb, (t-now)*1000+100);
}

/* ============================================================
   SPEECH
   ============================================================ */
let cachedVoice=null;
function getVoice(){
  if(cachedVoice) return cachedVoice;
  const vs = speechSynthesis.getVoices();
  cachedVoice = vs.find(v=>v.lang.toLowerCase().startsWith('ta'))
              ||vs.find(v=>v.lang.toLowerCase().startsWith('en-in'))
              ||vs[0]||null;
  return cachedVoice;
}
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=()=>{ cachedVoice=null; getVoice(); };

function speakLine(text){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ta-IN'; u.rate=0.80; u.pitch=1.18;
    const v=getVoice(); if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ============================================================
   CONFETTI
   ============================================================ */
const confettiChars='🎉🌟⭐🎵🌸💫🌈🎶✨🦋🎈🎊'.split('');
function spawnConfetti(){
  const layer=document.getElementById('confettiLayer');
  for(let i=0;i<20;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.textContent=confettiChars[Math.floor(Math.random()*confettiChars.length)];
    el.style.left=Math.random()*100+'vw';
    el.style.top='-30px';
    el.style.animationDuration=(1.6+Math.random()*2.2)+'s';
    el.style.animationDelay=Math.random()+'s';
    layer.appendChild(el);
    setTimeout(()=>el.remove(),5000);
  }
}

/* ============================================================
   NOTE PARTICLE
   ============================================================ */
const noteChars=['♩','♪','♫','♬','🎵','🎶','🎼'];
let noteInterval=null;
function spawnNoteParticle(){
  const el=document.createElement('div');
  el.className='note';
  el.textContent=noteChars[Math.floor(Math.random()*noteChars.length)];
  el.style.left=(8+Math.random()*84)+'vw';
  el.style.bottom=(20+Math.random()*50)+'vh';
  el.style.color=`hsl(${Math.random()*360},90%,62%)`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2100);
}

/* ============================================================
   APP STATE & UI
   ============================================================ */
let rIdx=0, lIdx=0, playing=false, looping=false, bpm=126;
let lineTimer=null;

const titleEl     = document.getElementById('rhymeTitle');
const mascotRow   = document.getElementById('mascotRow');
const lyricPrev   = document.getElementById('lyricPrev');
const lyricCurrent= document.getElementById('lyricCurrent');
const lyricNext   = document.getElementById('lyricNext');
const playBtn     = document.getElementById('playBtn');
const loopBtn     = document.getElementById('loopBtn');
const progressBar = document.getElementById('progressBar');
const tabsEl      = document.getElementById('tabs');
const lyricBox    = document.getElementById('lyricBox');

/* Build tabs */
RHYMES.forEach((r,i)=>{
  const btn=document.createElement('button');
  btn.className='tab'+(i===0?' active':'');
  btn.textContent=`${r.emoji} ${r.title}`;
  btn.addEventListener('click',()=>{ stopAll(); loadRhyme(i); });
  tabsEl.appendChild(btn);
});

/* ── loadRhyme ── */
function loadRhyme(i){
  rIdx=i; lIdx=0;
  const r=RHYMES[i];
  document.querySelectorAll('.tab').forEach((t,ti)=>t.classList.toggle('active',ti===i));
  titleEl.textContent=r.title;
  document.body.style.background=`linear-gradient(160deg,${r.bg[0]},${r.bg[1]})`;
  // mascots
  mascotRow.innerHTML='';
  r.mascots.forEach((m,mi)=>{
    const s=document.createElement('span');
    s.className='moji';
    s.textContent=m;
    s.style.animationDelay=(mi*0.2)+'s';
    mascotRow.appendChild(s);
  });
  // reset lyrics
  lyricPrev.textContent='';
  lyricCurrent.textContent=r.lines[0];
  lyricNext.textContent=r.lines[1]||'';
  progressBar.style.width='0%';
}

/* ── updateLyrics ── */
function updateLyrics(lineIndex){
  const r=RHYMES[rIdx];
  lyricBox.classList.remove('flash');
  void lyricBox.offsetWidth; // reflow to restart animation
  lyricBox.classList.add('flash');

  lyricPrev.textContent = lineIndex>0 ? r.lines[lineIndex-1] : '';
  lyricCurrent.textContent = r.lines[lineIndex]||'';
  lyricNext.textContent = r.lines[lineIndex+1]||'';

  progressBar.style.width=((lineIndex+1)/r.lines.length*100)+'%';
  speakLine(r.lines[lineIndex]);
}

/* ── playSequence ── */
function playSequence(){
  if(!playing) return;
  const r=RHYMES[rIdx];
  const beatDur=60/bpm;
  // beats per line = total melody beats / lines (each line ~8 beats average)
  const totalBeats=r.melody.reduce((s,[,b])=>s+b,0);
  const secPerLine=(totalBeats/r.lines.length)*beatDur;

  updateLyrics(lIdx);
  lIdx++;

  if(lIdx>=r.lines.length){
    // finished this rhyme
    lineTimer=setTimeout(()=>{
      if(!playing) return;
      spawnConfetti();
      const next=(rIdx+1)%RHYMES.length;
      if(!looping || next!==rIdx){
        stopAll();
        setTimeout(()=>{ loadRhyme(next); startPlaying(); },1400);
      } else {
        lIdx=0; scheduleSong(r.melody,bpm,audioCtx.currentTime);
        playSequence();
      }
    }, secPerLine*1000);
    return;
  }
  lineTimer=setTimeout(playSequence, secPerLine*1000);
}

/* ── startPlaying ── */
function startPlaying(){
  playing=true;
  playBtn.textContent='⏸ நிறுத்து';
  ensureAudio();
  document.querySelectorAll('.moji').forEach(m=>m.classList.add('bounce'));
  noteInterval=setInterval(spawnNoteParticle,800);

  const r=RHYMES[rIdx];
  scheduleSong(r.melody, bpm, audioCtx.currentTime+0.08);

  lIdx=0;
  const beatDur=60/bpm;
  const totalBeats=r.melody.reduce((s,[,b])=>s+b,0);
  const secPerLine=(totalBeats/r.lines.length)*beatDur;

  updateLyrics(lIdx);
  lIdx=1;
  lineTimer=setTimeout(playSequence, secPerLine*1000);
}

/* ── stopAll ── */
function stopAll(){
  playing=false;
  playBtn.textContent='▶ பாடு';
  clearTimeout(lineTimer);
  clearInterval(noteInterval);
  if('speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('.moji').forEach(m=>m.classList.remove('bounce'));
  if(audioCtx && audioCtx.state!=='closed'){
    try{ audioCtx.close(); }catch(e){}
  }
  audioCtx=null; masterGain=null;
}

/* ── Controls ── */
playBtn.addEventListener('click',()=>{
  if(playing){ stopAll(); } else { ensureAudio(); startPlaying(); }
});
loopBtn.addEventListener('click',()=>{
  looping=!looping;
  loopBtn.classList.toggle('on',looping);
  loopBtn.textContent=looping?'🔁 திரும்பி':'🔁 திரும்ப';
});
document.getElementById('slowBtn').addEventListener('click',()=>{
  bpm=Math.max(70,bpm-15);
  if(playing){ stopAll(); startPlaying(); }
});
document.getElementById('fastBtn').addEventListener('click',()=>{
  bpm=Math.min(200,bpm+20);
  if(playing){ stopAll(); startPlaying(); }
});

/* ── Intro start ── */
document.getElementById('startBtn').addEventListener('click',()=>{
  const overlay=document.getElementById('intro');
  overlay.style.opacity='0';
  setTimeout(()=>overlay.remove(),700);
  loadRhyme(0);
  spawnConfetti();
  playJingle(()=>startPlaying());
});

/* Initial load */
loadRhyme(0);
</script>
